[project]
name = "ai-document-approval"
version = "0.1.0"
description = "Human-in-the-loop AI document processing portfolio project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.10",
  "python-multipart>=0.0.17",
  "pypdf>=5.1",
]

[project.optional-dependencies]
ai = ["pydantic-ai>=1.0"]
dev = ["pytest>=8.3", "reportlab>=4.2", "matplotlib>=3.9", "playwright>=1.50"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
