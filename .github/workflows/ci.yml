name: CI
on: [push, pull_request]

jobs:
  test-evaluate-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: Tests
        run: pytest -q
      - name: Generate synthetic PDF corpus
        run: python scripts/generate_synthetic_corpus.py
      - name: Evaluate routing safety
        run: PYTHONPATH=src python scripts/run_evaluation.py
      - name: Build branded benchmark chart
        run: PYTHONPATH=src python scripts/plot_evaluation.py
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Start demo API
        run: |
          PYTHONPATH=src uvicorn app.main:app --host 127.0.0.1 --port 8000 >/tmp/doc-ai.log 2>&1 &
          echo $! >/tmp/doc-ai.pid
          python - <<'PY'
          import time, urllib.request
          for _ in range(60):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2) as r:
                      if r.status == 200:
                          break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit('API did not become healthy')
          PY
      - name: Capture live review dashboard and architecture
        run: PYTHONPATH=src python scripts/capture_demo_screenshot.py
      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/doc-ai.pid ]; then kill "$(cat /tmp/doc-ai.pid)" || true; fi
          if [ -f /tmp/doc-ai.log ]; then tail -n 100 /tmp/doc-ai.log; fi
      - name: Upload portfolio artifacts
        uses: actions/upload-artifact@v4
        with:
          name: document-approval-portfolio
          path: |
            artifacts/evaluation.json
            artifacts/approval_safety.png
            artifacts/review_dashboard.png
            artifacts/architecture_process.png
